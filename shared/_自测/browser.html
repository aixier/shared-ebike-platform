<!doctype html>
<meta charset="utf-8">
<title>浏览器自测</title>
<pre id="out">运行中</pre>
<script type="module">
// 浏览器内冒烟自测：真实 fetch + IndexedDB + BroadcastChannel。打开 /shared/_自测/browser.html?debug=1
import { api } from '../api.js';
const out = [];
const log = (ok, name, extra = '') => out.push(`${ok ? '通过' : '失败'} ${name}${extra ? ' ' + extra : ''}`);
const t0 = performance.now();
try {
  await api.system.reset();
  log(true, '载入 mockdata 并写入本地存储', `${Math.round(performance.now() - t0)}ms`);
  // 另一个同源文档（相当于另一个标签页）从本地存储读取并监听事件
  const got = new Promise(res => addEventListener('message', e => { if (e.data && e.data.type === 'heard') res(e.data); }));
  const ready = new Promise(res => addEventListener('message', e => { if (e.data && e.data.type === 'listening') res(e.data); }));
  const f = document.createElement('iframe'); f.src = './listener.html?debug=1'; document.body.append(f);
  const r0 = await ready;
  log(r0.orders > 800, '另一端从 IndexedDB 读到数据', `订单 ${r0.orders} 条`);
  const t1 = performance.now();
  await api.system.debug.switchUser('U100341');
  const me = await api.user.me();
  const lat = performance.now() - t1;
  log(lat >= 150, '接口有真实延迟', `${Math.round(lat)}ms`);
  const s = await api.user.scan('SF86020226');
  log(s.check.ok && s.vehicle.vehicleId === 'VH000004', '扫码', s.price.text);
  const r = await api.user.unlock('SF86020226');
  log(r.status === '骑行中', '开锁', r.orderId);
  const heard = await Promise.race([got, new Promise(res => setTimeout(() => res(null), 5000))]);
  log(!!heard && heard.orderId === r.orderId, '另一端实时收到 order.created', heard ? heard.orderId : '超时');
  const back = await api.user.returnBike({ method: 'lock', stationId: 'ST0002' });
  log(back.order.status === '已结束', '还车出账单', back.message);
  await api.admin.login('qhcx.he', 'Shifan@2026');
  const ol = await api.admin.operator.orders.list({ q: r.orderId });
  log(ol.rows.length === 1 && !('userId' in ol.rows[0]), '运营商明细查到新订单且不含用户身份');
  try { await api.admin.operator.settlements.get('ST-M-202611-OP02'); log(false, '越权'); } catch (e) { log(e.code === 'SCOPE_DENIED', '越权返回明确错误', e.message); }
  const keys = Object.keys(localStorage).filter(k => !k.startsWith('bike.'));
  log(keys.length === 0, 'localStorage 键名都以 bike. 开头', keys.join(','));
} catch (e) {
  log(false, '异常', `${e.code || ''} ${e.message}`);
}
document.getElementById('out').textContent = out.join('\n');
document.title = out.every(x => x.startsWith('通过')) ? '全部通过' : '有失败';
</script>
