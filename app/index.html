<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFBF5">
<title>共享骑行</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23F97316'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/mobile.css">
<link rel="stylesheet" href="./app.css">
</head>
<body class="m-desktop">
<div class="m-app" id="app" data-skin="wechat">
  <div class="m-status" id="statusbar" aria-hidden="true"><span id="clockText">9:41</span><span class="sh-sys"><i class="sh-sig"></i><i class="sh-wifi"></i><i class="sh-bat"></i></span></div>
  <div class="m-nav" id="nav">
    <button class="m-nav-back" id="navBack" type="button" aria-label="返回" hidden>‹</button>
    <span class="m-nav-title" id="navTitle"></span>
    <div class="m-capsule" id="capsule">
      <button type="button" id="capMore" aria-label="更多"></button><i></i><button type="button" id="capClose" aria-label="关闭"></button>
    </div>
  </div>
  <div class="m-viewport" id="view"></div>
  <div class="sh-splash" id="splash" aria-hidden="true">
    <div class="sh-splash-in">
      <div class="sh-logo" aria-hidden="true"><svg viewBox="0 0 48 48" width="40" height="40"><circle cx="12" cy="32" r="7" fill="none" stroke="#2A1405" stroke-width="3"/><circle cx="36" cy="32" r="7" fill="none" stroke="#2A1405" stroke-width="3"/><path d="M12 32l7-14h10l7 14M19 18l5 14M27 18h5" fill="none" stroke="#2A1405" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h1>共享骑行</h1>
      <p>扫码即骑 · 还车自动结算</p>
      <div class="sh-splash-bar"><i></i></div>
    </div>
    <small class="sh-splash-foot" id="splashFoot">微信小程序</small>
  </div>
</div>
<noscript><p style="padding:24px">请在支持脚本的浏览器中打开。</p></noscript>
<script>
window.__shFail = function () {
  if (!sessionStorage.getItem('sh.retry')) { sessionStorage.setItem('sh.retry', '1'); location.reload(); return; }
  sessionStorage.removeItem('sh.retry');
  document.getElementById('splash').innerHTML = '<div style="padding:32px;text-align:center">小程序没有打开，请检查网络后重试<br><br><button class="m-btn m-btn-primary" onclick="location.reload()">重新打开</button></div>';
};
</script>
<script type="module" src="./shell.js" onerror="__shFail()"></script>
</body>
</html>
