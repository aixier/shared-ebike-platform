openapi: 3.0.3
info:
  title: 共享电单车监管平台 · ops 运行值守
  version: 1.0.0
  description: |
    降级事件、限额使用量、恢复闭合、品牌健康指标、暂停可租建议、告警。

    只返回本模块持有的数据：品牌名称、接入状态、车辆数归 fleet，订单全貌归 ride，费用归 bill，
    页面由前端按 brandId、orderId 另查后拼装。本模块没有被其他模块调用的接口。

    同步调用：fleet（暂停可租、恢复可租）、ride（补录锁车事实）、pay（确认收款结果）。
    金额为整数分，比率为小数（0.874 表示 87.4%），时间为 RFC 3339。
tags:
  - name: 运维
    description: 运维值班、接入负责人使用的页面接口
  - name: 主管部门
    description: 主管部门只读各品牌开锁成功率
  - name: 运营商
    description: 运营商查看本运营商品牌的开锁成功率与暂停记录
  - name: 公共
    description: 不需要登录
paths:
  /api/ops/monitor:
    get:
      operationId: getMonitor
      summary: 运行监控（完整版）
      description: 降级状态、各品牌健康指标与序列、平台可用性日统计、今日开锁情况、门槛、未确认告警、待确认暂停建议。品牌名称、接入状态、车辆数由前端另查 fleet。
      tags: [运维]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.ops.monitor
      x-requirements: [R-31, R-33, R-43, NFR-07]
      x-permissions: [ops.monitor]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, INVALID]
      parameters:
        - { name: hours, in: query, description: 小时序列回看的小时数, schema: { type: integer, minimum: 1, maximum: 720, default: 72 } }
        - { name: days, in: query, description: 日序列回看的天数, schema: { type: integer, minimum: 1, maximum: 366, default: 30 } }
      responses:
        '200':
          description: 运行监控数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
  /api/ops/monitor/unlock-rate:
    get:
      operationId: getMonitorUnlockRate
      summary: 运行监控（主管部门精简版）
      description: 只含各品牌最近一次开锁成功率与小时序列，不含降级、告警、可用率。
      tags: [主管部门]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.ops.monitor
      x-requirements: [R-43]
      x-permissions: [metrics.unlockRate.view, ops.monitor]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, INVALID]
      parameters:
        - { name: hours, in: query, description: 小时序列回看的小时数, schema: { type: integer, minimum: 1, maximum: 720, default: 72 } }
      responses:
        '200':
          description: 精简版监控数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitorLimited' }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
  /api/ops/brands/unlock-rate:
    get:
      operationId: listBrandUnlockRates
      summary: 各品牌最近开锁成功率
      description: 前端拼接入状态总览用。运营商账号只返回本运营商的品牌，查询范围外的品牌返回 SCOPE_DENIED。
      tags: [主管部门, 运营商, 运维]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.access.overview
      x-requirements: [R-43]
      x-permissions: [access.view, access.view.own, ops.monitor, metrics.unlockRate.view]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, SCOPE_DENIED]
      parameters:
        - name: brandIds
          in: query
          description: 品牌编号，逗号分隔；不传为数据范围内全部品牌
          style: form
          explode: false
          schema: { type: array, items: { type: string, example: BR01 } }
      responses:
        '200':
          description: 各品牌最近一次上报的开锁成功率
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BrandUnlockRate' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
  /api/ops/degrade/public:
    get:
      operationId: getPublicDegrade
      summary: 当前降级状态（公开）
      description: 用户端据此决定是否显示“费用将稍后收取”。不需要登录。
      tags: [公共]
      security: []
      x-prototype: api.system.degrade
      x-requirements: [R-31]
      x-errors: [SERVER_BUSY]
      responses:
        '200':
          description: 当前降级状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicDegrade' }
  /api/ops/degrade/status:
    get:
      operationId: getDegradeStatus
      summary: 降级与限额使用情况
      tags: [运维]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.ops.degrade.status
      x-requirements: [R-31, R-33, BR-30]
      x-permissions: [ops.monitor, degrade.closure.view]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN]
      responses:
        '200':
          description: 降级状态与限额使用量
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DegradeStatus' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
  /api/ops/degrade/events:
    get:
      operationId: listDegradeEvents
      summary: 降级事件列表
      description: 按进入时刻新到旧，不分页。
      tags: [运维]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.ops.degrade.events
      x-requirements: [R-31, R-35]
      x-permissions: [ops.monitor, degrade.closure.view]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN]
      responses:
        '200':
          description: 降级事件
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DegradeEvent' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
  /api/ops/degrade/events/{eventId}:
    get:
      operationId: getDegradeEvent
      summary: 降级事件详情
      description: 事件加逐单闭合项。逐单只含订单号、三项事实、状态、缺项，订单全貌由前端按订单号另查 ride。
      tags: [运维]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.ops.degrade.event
      x-requirements: [R-31, R-34, R-35, BR-32]
      x-permissions: [ops.monitor, degrade.closure.view]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, NOT_FOUND]
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: 降级事件与逐单闭合项
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DegradeEventDetail' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
  /api/ops/degrade/enter:
    post:
      operationId: enterDegrade
      summary: 值班人手动进入降级
      description: 写降级事件、通知值班人、写告警与留痕。已在降级中时返回当前事件，不新建。操作人取登录账号。
      tags: [运维]
      security: [{ adminAuth: [] }]
      x-prototype: api.system.setDegrade
      x-requirements: [R-31, R-35]
      x-permissions: [degrade.control]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, INVALID, REASON_REQUIRED, READONLY]
      parameters:
        - $ref: './_common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnterDegradeRequest' }
      responses:
        '200':
          description: 进入后的降级事件
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DegradeEvent' }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
  /api/ops/degrade/exit:
    post:
      operationId: exitDegrade
      summary: 值班人手动退出降级
      description: 故障恢复后退出，发布“降级已退出”，各模块逐单回放、计价、收款、补验实名，本模块按结果记闭合项。
      tags: [运维]
      security: [{ adminAuth: [] }]
      x-prototype: api.system.setDegrade
      x-requirements: [R-31, R-34, R-35, BR-32]
      x-permissions: [degrade.control]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, DEGRADE_NOT_ACTIVE, REASON_REQUIRED, READONLY, INVALID]
      parameters:
        - $ref: './_common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptionalReasonRequest' }
      responses:
        '200':
          description: 退出后的降级事件
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DegradeEvent' }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }
  /api/ops/degrade/tighten:
    post:
      operationId: tightenDegrade
      summary: 收紧降级开单
      description: 暂停押金状态未知的老用户与先骑后验新用户的降级开单。本模块发“降级已收紧”，由 ride 执行。
      tags: [运维]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.ops.degrade.tighten
      x-requirements: [R-33, R-35, BR-30]
      x-permissions: [degrade.control]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, REASON_REQUIRED, DEGRADE_NOT_ACTIVE, READONLY, INVALID]
      parameters:
        - $ref: './_common.yaml#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200':
          description: 操作后的降级状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DegradeStatus' }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }
  /api/ops/degrade/stop:
    post:
      operationId: stopDegrade
      summary: 停止降级开新单
      description: 已开锁的订单不受影响。本模块发“降级已停止”，由 ride 执行。
      tags: [运维]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.ops.degrade.stop
      x-requirements: [R-33, R-35, BR-30]
      x-permissions: [degrade.control]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, REASON_REQUIRED, DEGRADE_NOT_ACTIVE, READONLY, INVALID]
      parameters:
        - $ref: './_common.yaml#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200':
          description: 操作后的降级状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DegradeStatus' }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }
  /api/ops/degrade/relax:
    post:
      operationId: relaxDegrade
      summary: 放宽降级开单
      description: 取消收紧或停止，恢复正常降级开单。本模块发“降级已放宽”，由 ride 执行。
      tags: [运维]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.ops.degrade.relax
      x-requirements: [R-33, R-35, BR-30]
      x-permissions: [degrade.control]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, REASON_REQUIRED, DEGRADE_NOT_ACTIVE, READONLY, INVALID]
      parameters:
        - $ref: './_common.yaml#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200':
          description: 操作后的降级状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DegradeStatus' }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }
  /api/ops/closures:
    get:
      operationId: listClosures
      summary: 降级单闭合情况
      description: 两个参数都不传时返回全部未闭合的单。按开单时刻新到旧，不分页。
      tags: [运维]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.ops.closure.list
      x-requirements: [R-34, BR-32]
      x-permissions: [degrade.closure.view, degrade.closure.handle]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, INVALID]
      parameters:
        - { name: eventId, in: query, description: 降级事件编号, schema: { type: string, example: OPS-DG-20261127-01 } }
        - { name: status, in: query, description: 闭合状态, schema: { $ref: '#/components/schemas/ClosureStatus' } }
      responses:
        '200':
          description: 闭合项
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClosureItem' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
  /api/ops/closures/{orderId}/handle:
    post:
      operationId: handleClosure
      summary: 人工补齐降级单缺项
      description: 补录锁车事实时调 ride，由 ride 结束订单、bill 计价收款；确认收款结果时调 pay 落定结果未知的扣款。三项齐全后闭合。
      tags: [运维]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.ops.closure.handle
      x-requirements: [R-34, BR-32]
      x-permissions: [degrade.closure.handle]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, NOT_FOUND, INVALID, REASON_REQUIRED, CONFLICT, SERVER_BUSY, READONLY]
      parameters:
        - { name: orderId, in: path, required: true, description: 订单号, schema: { type: string, example: OD2026112714209 } }
        - $ref: './_common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandleClosureRequest' }
      responses:
        '200':
          description: 处理后的闭合项
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClosureItem' }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }
  /api/ops/alerts:
    get:
      operationId: listAlerts
      summary: 告警列表
      description: 默认按时刻新到旧。
      tags: [运维]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.ops.alerts.list
      x-requirements: [R-33, R-35]
      x-permissions: [ops.monitor]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, INVALID]
      parameters:
        - { name: level, in: query, description: 级别, schema: { $ref: '#/components/schemas/AlertLevel' } }
        - { name: acked, in: query, description: 是否已确认；不传为全部, schema: { type: boolean } }
        - $ref: './_common.yaml#/components/parameters/Page'
        - $ref: './_common.yaml#/components/parameters/PageSize'
        - $ref: './_common.yaml#/components/parameters/SortKey'
        - $ref: './_common.yaml#/components/parameters/SortDir'
      responses:
        '200':
          description: 分页告警
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertPage' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
  /api/ops/alerts/{alertId}/ack:
    post:
      operationId: ackAlert
      summary: 确认告警
      tags: [运维]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.ops.alerts.ack
      x-requirements: [R-33, R-35]
      x-permissions: [ops.monitor]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, NOT_FOUND, ALREADY_DONE, READONLY, INVALID]
      parameters:
        - { name: alertId, in: path, required: true, description: 告警编号, schema: { type: string, example: OPS-AL-20261018-01 } }
        - $ref: './_common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 确认后的告警
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }
  /api/ops/pauses:
    get:
      operationId: listPauses
      summary: 暂停可租记录
      description: 按暂停时刻新到旧，不分页。运营商账号只返回本运营商品牌的记录。
      tags: [运维, 主管部门, 运营商]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.ops.pauses
      x-requirements: [R-43]
      x-permissions: [ops.monitor, access.view, access.view.own]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, INVALID]
      responses:
        '200':
          description: 暂停可租记录。例外条款：因开锁成功率暂停的品牌不得自动恢复，指标回升后只提示，由运维人工恢复（autoResume 固定 false）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pause' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
  /api/ops/suspend-suggestions:
    get:
      operationId: listSuspendSuggestions
      summary: 运行智能体的暂停可租建议
      description: 按提出时刻新到旧，不分页。
      tags: [运维]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.ops.suspendSuggestions
      x-requirements: [R-43]
      x-permissions: [ops.monitor, access.pause]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, INVALID]
      parameters:
        - { name: status, in: query, description: 建议状态, schema: { $ref: '#/components/schemas/SuggestionStatus' } }
        - { name: brandId, in: query, description: 品牌编号, schema: { type: string, example: BR02 } }
      responses:
        '200':
          description: 暂停可租建议
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SuspendSuggestion' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
  /api/ops/suspend-suggestions/{suggestionId}/confirm:
    post:
      operationId: confirmSuspend
      summary: 确认暂停可租建议
      description: 调 fleet 暂停可租，记暂停记录，留痕记确认人。
      tags: [运维]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.ops.confirmSuspend
      x-requirements: [R-43]
      x-permissions: [access.pause]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, NOT_FOUND, REASON_REQUIRED, ALREADY_DONE, CONFLICT, SERVER_BUSY, READONLY, INVALID]
      parameters:
        - $ref: '#/components/parameters/SuggestionId'
        - $ref: './_common.yaml#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200':
          description: 确认后的建议
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuspendSuggestion' }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }
  /api/ops/suspend-suggestions/{suggestionId}/dismiss:
    post:
      operationId: dismissSuspend
      summary: 驳回暂停可租建议
      description: 品牌保持已接入。
      tags: [运维]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.ops.dismissSuspend
      x-requirements: [R-43]
      x-permissions: [access.pause]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, NOT_FOUND, REASON_REQUIRED, ALREADY_DONE, READONLY, INVALID]
      parameters:
        - $ref: '#/components/parameters/SuggestionId'
        - $ref: './_common.yaml#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200':
          description: 驳回后的建议
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuspendSuggestion' }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }
  /api/ops/auto-suspend:
    put:
      operationId: setAutoSuspend
      summary: 设置自动暂停开关
      description: 开启后指标持续低于门槛且判定为品牌自身问题时，由运行智能体直接暂停可租。默认关闭。
      tags: [运维]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.ops.setAutoSuspend
      x-requirements: [R-43]
      x-permissions: [access.pause]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, INVALID, REASON_REQUIRED, READONLY]
      parameters:
        - $ref: './_common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [on, reason]
              properties:
                on: { type: boolean, description: 是否开启自动暂停 }
                reason: { $ref: './_common.yaml#/components/schemas/Reason' }
      responses:
        '200':
          description: 设置后的开关
          content:
            application/json:
              schema:
                type: object
                required: [autoPauseByAgent]
                properties:
                  autoPauseByAgent: { type: boolean, description: 自动暂停是否开启 }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
  /api/ops/brands/{brandId}/pause:
    post:
      operationId: pauseBrand
      summary: 人工暂停可租
      description: 调 fleet 暂停可租，记暂停记录并发告警。品牌不是已接入时 fleet 拒绝，返回 CONFLICT。
      tags: [运维]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.ops.pause
      x-requirements: [R-43]
      x-permissions: [access.pause]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, NOT_FOUND, REASON_REQUIRED, CONFLICT, SERVER_BUSY, READONLY, INVALID]
      parameters:
        - $ref: '#/components/parameters/BrandId'
        - $ref: './_common.yaml#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200':
          description: 新的暂停记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pause' }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }
  /api/ops/brands/{brandId}/resume:
    post:
      operationId: resumeBrand
      summary: 人工恢复可租
      description: 调 fleet 恢复可租，回到已接入，补记暂停记录的恢复时刻。品牌未处于暂停可租时返回 CONFLICT。
      tags: [运维]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.ops.resume
      x-requirements: [R-43]
      x-permissions: [access.pause]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, NOT_FOUND, REASON_REQUIRED, CONFLICT, SERVER_BUSY, READONLY, INVALID]
      parameters:
        - $ref: '#/components/parameters/BrandId'
        - $ref: './_common.yaml#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200':
          description: 已补记恢复时刻的暂停记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pause' }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }
  /api/ops/todos:
    get:
      operationId: getOpsTodos
      summary: 本模块待办计数
      description: 顶栏待办用，前端与其他模块的待办汇总。按登录账号的权限点返回，只含计数大于 0 的项。
      tags: [运维]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.me
      x-requirements: [R-33, R-34, R-43]
      x-permissions: [ops.monitor, degrade.control, degrade.closure.view, degrade.closure.handle, access.pause]
      x-errors: [ADMIN_NOT_LOGGED_IN]
      responses:
        '200':
          description: 待办计数
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Todo' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
components:
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      description: 降级事件编号
      schema: { type: string, example: OPS-DG-20261127-01 }
    SuggestionId:
      name: suggestionId
      in: path
      required: true
      description: 暂停建议编号
      schema: { type: string, example: OPS-SG-20261201-01 }
    BrandId:
      name: brandId
      in: path
      required: true
      description: 品牌编号
      schema: { type: string, example: BR02 }
  requestBodies:
    Reason:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ReasonRequest' }
  schemas:
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { $ref: './_common.yaml#/components/schemas/Reason' }
    OptionalReasonRequest:
      type: object
      properties:
        reason: { $ref: './_common.yaml#/components/schemas/Reason' }
    EnterDegradeRequest:
      type: object
      description: 给 preset，或给 cause 加 components；都给时以 cause、components 为准
      properties:
        preset:
          type: string
          description: 故障预设
          enum: [支付通道故障, 实名核验不可用, 押金与免押查询不可用, 授权不可用]
        cause: { type: string, description: 故障原因, example: 支付通道故障（微信支付回调持续超时） }
        components:
          type: array
          description: 故障组件
          minItems: 1
          items: { $ref: '#/components/schemas/FaultComponent' }
        reason: { $ref: './_common.yaml#/components/schemas/Reason' }
    FaultComponent:
      type: string
      description: 故障组件，与 events/ops.md 的 components 同一集合。请求里仍接受旧名（微信支付收款、支付宝收款归支付通道；微信授权、支付宝授权归授权），响应与事件一律用下列取值
      enum: [支付通道, 实名核验, 押金与免押查询, 授权, 数据库, 计费]
    PublicDegrade:
      type: object
      required: [active, eventId, cause, components, tightened, stopped]
      properties:
        active: { type: boolean, description: 是否处于降级开单 }
        eventId: { type: string, nullable: true, description: 当前降级事件编号 }
        cause: { type: string, nullable: true, description: 故障原因 }
        components:
          type: array
          description: 故障组件
          items: { $ref: '#/components/schemas/FaultComponent' }
        tightened: { type: boolean, description: 值班人是否已收紧 }
        stopped: { type: boolean, description: 值班人是否已停止开新单 }
    RiskLimitTier:
      type: object
      required: [maxMinutes, maxAmount]
      properties:
        maxMinutes: { type: integer, description: 单笔时长上限（分钟） }
        maxAmount:
          allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }]
          description: 单笔金额上限
    RiskLimits:
      type: object
      description: 降级限额，取自规则版本
      required: [perUserOpenDegradedOrders, normal, tight, hourlyDegradedOrders, degradeDurationAlertMinutes]
      properties:
        perUserOpenDegradedOrders: { type: integer, description: 每个用户未闭合降级单上限 }
        normal:
          allOf: [{ $ref: '#/components/schemas/RiskLimitTier' }]
          description: 老用户的正常档
        tight:
          allOf: [{ $ref: '#/components/schemas/RiskLimitTier' }]
          description: 押金状态未知的老用户与先骑后验新用户的紧档
        hourlyDegradedOrders: { type: integer, description: 近 1 小时降级单量上限 }
        degradeDurationAlertMinutes: { type: integer, description: 降级持续多少分钟提醒值班人 }
    DegradeUsage:
      type: object
      description: 限额使用量，由代码计算
      required: [lastHourOrders, hourlyLimit, orders, riding, amountSoFar, overLimitRiding]
      properties:
        lastHourOrders: { type: integer, description: 近 1 小时降级单量 }
        hourlyLimit: { type: integer, description: 近 1 小时降级单量上限 }
        orders: { type: integer, description: 本次降级累计单数 }
        riding: { type: integer, description: 本次降级骑行中单数 }
        amountSoFar:
          allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }]
          description: 本次降级累计金额（已出账的应收加骑行中的估算）
        overLimitRiding: { type: integer, description: 骑行中且已超单笔上限的单数 }
    DegradeStatus:
      type: object
      required: [degraded, tightened, stopped, cause, components, eventId, lastDegradeEventId, event, minutes, usage, limits, limitsVersionId]
      properties:
        degraded: { type: boolean, description: 是否处于降级开单 }
        tightened: { type: boolean, description: 是否已收紧 }
        stopped: { type: boolean, description: 是否已停止开新单 }
        cause: { type: string, nullable: true, description: 故障原因 }
        components:
          type: array
          description: 故障组件
          items: { $ref: '#/components/schemas/FaultComponent' }
        eventId: { type: string, nullable: true, description: 当前降级事件编号 }
        lastDegradeEventId: { type: string, nullable: true, description: 最近一次降级事件编号 }
        event:
          allOf: [{ $ref: '#/components/schemas/DegradeEvent' }]
          nullable: true
          description: 当前降级事件，不在降级时为 null
        minutes: { type: integer, description: 已降级分钟数，不在降级时为 0 }
        usage: { $ref: '#/components/schemas/DegradeUsage' }
        limits: { $ref: '#/components/schemas/RiskLimits' }
        limitsVersionId: { type: string, description: 限额所属规则版本号, example: PR0003 }
    TimelineEntry:
      type: object
      required: [at, by, action, text]
      properties:
        at: { $ref: './_common.yaml#/components/schemas/Time' }
        by: { type: string, description: 操作人账号编号, example: AC0901 }
        byName: { type: string, description: 操作人名称 }
        byKind:
          type: string
          description: 操作人类别，用于区分智能体与人
          enum: [人, 智能体, 系统, 用户]
        action:
          type: string
          description: 动作
          enum: [检测到故障, 降级进入, 降级收紧, 降级停止, 降级放宽, 值班人确认, 降级退出, 部分闭合, 全部闭合]
        text: { type: string, description: 说明 }
    EventClosureSummary:
      type: object
      description: 事件级闭合汇总
      required: [status, closed, pendingOrderIds, paymentResults, newUserVerification]
      properties:
        status:
          type: string
          description: 事件闭合状态
          enum: [未开始, 部分待人工, 已全部闭合]
        closed: { type: integer, description: 已闭合单数 }
        pendingOrderIds:
          type: array
          description: 未闭合订单号
          items: { type: string }
        paymentResults:
          type: object
          description: 按收款结果计数，键为 已收款、已推送一键支付、已转欠费、结果未知、未收款
          additionalProperties: { type: integer }
        newUserVerification:
          type: object
          description: 先骑后验新用户补验结果计数，键为 通过、未通过、待核验
          additionalProperties: { type: integer }
    DegradeEvent:
      type: object
      required: [eventId, cause, components, enteredAt, exitedAt, durationMinutes, enteredBy, status, orderIds, orderCount, receivableSum, admissionCounts, limitsVersionId, limits, closure, timeline]
      properties:
        eventId: { type: string, description: 降级事件编号, example: OPS-DG-20261127-01 }
        cause: { type: string, description: 故障原因 }
        components:
          type: array
          description: 故障组件
          items: { $ref: '#/components/schemas/FaultComponent' }
        enteredAt:
          allOf: [{ $ref: './_common.yaml#/components/schemas/Time' }]
          description: 进入时刻
        exitedAt:
          allOf: [{ $ref: './_common.yaml#/components/schemas/Time' }]
          nullable: true
          description: 退出时刻
        durationMinutes: { type: integer, nullable: true, description: 持续分钟数，退出后有值 }
        enteredBy: { type: string, description: 进入操作人账号编号，运行智能体或值班人 }
        enteredByName: { type: string, description: 进入操作人名称 }
        exitedBy: { type: string, nullable: true, description: 退出操作人账号编号 }
        exitedByName: { type: string, nullable: true, description: 退出操作人名称 }
        status:
          type: string
          description: 事件状态
          enum: [进行中, 已退出]
        orderIds:
          type: array
          description: 本次降级开出的订单号
          items: { type: string }
        orderCount: { type: integer, description: 降级单数 }
        receivableSum:
          allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }]
          description: 已出账降级单的应收合计
        admissionCounts:
          type: object
          description: 按准入类别计数，键为 老用户、押金状态未知的老用户、先骑后验新用户
          additionalProperties: { type: integer }
        limitsVersionId: { type: string, description: 进入时的限额所属规则版本号 }
        limits: { $ref: '#/components/schemas/RiskLimits' }
        maxHourlyOrders: { type: integer, description: 期间近 1 小时降级单量的最大值 }
        maxUserOpenOrders: { type: integer, description: 期间单个用户未闭合降级单的最大值 }
        overLimitReminders: { type: integer, description: 超限提醒次数 }
        closure: { $ref: '#/components/schemas/EventClosureSummary' }
        timeline:
          type: array
          description: 时间线，进入、收紧、停止、放宽、退出都在其中
          items: { $ref: '#/components/schemas/TimelineEntry' }
    DegradeEventDetail:
      allOf:
        - $ref: '#/components/schemas/DegradeEvent'
        - type: object
          required: [orders]
          properties:
            orders:
              type: array
              description: 逐单闭合项
              items: { $ref: '#/components/schemas/ClosureItem' }
    ClosureStatus:
      type: string
      description: 骑行中为还车后自动闭合；待闭合为等待恢复后收款；待人工为缺项需值班人处理
      enum: [骑行中, 待闭合, 待人工, 已闭合]
    ClosureItem:
      type: object
      description: 一笔降级单的闭合项。三项事实齐全才算闭合
      required: [orderId, eventId, unlockResult, lockFact, payment, status, missing, closedAt, note]
      properties:
        orderId: { type: string, description: 订单号, example: OD2026112714209 }
        eventId: { type: string, description: 降级事件编号 }
        unlockResult: { type: boolean, description: 是否已有开锁结果 }
        lockFact: { type: boolean, description: 是否已有锁车事实 }
        payment:
          type: string
          description: 收款结果
          enum: [已收款, 已推送一键支付, 已转欠费, 结果未知, 未收款]
        status: { $ref: '#/components/schemas/ClosureStatus' }
        missing:
          type: array
          description: 缺项
          items:
            type: string
            enum: [开锁结果, 锁车事实, 收款结果]
        closedAt:
          allOf: [{ $ref: './_common.yaml#/components/schemas/Time' }]
          nullable: true
          description: 闭合时刻
        note: { type: string, nullable: true, description: 说明 }
    HandleClosureRequest:
      oneOf:
        - $ref: '#/components/schemas/RecordLockFactRequest'
        - $ref: '#/components/schemas/ConfirmPaymentRequest'
      discriminator:
        propertyName: action
        mapping:
          补录锁车事实: '#/components/schemas/RecordLockFactRequest'
          确认收款结果: '#/components/schemas/ConfirmPaymentRequest'
    RecordLockFactRequest:
      type: object
      required: [action, endAt, reason]
      properties:
        action: { type: string, enum: [补录锁车事实] }
        endAt:
          allOf: [{ $ref: './_common.yaml#/components/schemas/Time' }]
          description: 锁车时刻，须在开锁之后、现在之前
        stationId: { type: string, description: 还车站点编号；不传按车辆当前位置判定, example: ST0001 }
        reason: { $ref: './_common.yaml#/components/schemas/Reason' }
    ConfirmPaymentRequest:
      type: object
      required: [action, result, reason]
      properties:
        action: { type: string, enum: [确认收款结果] }
        result:
          type: string
          description: 向渠道核实后的结果
          enum: [已收款, 未收款]
        reason: { $ref: './_common.yaml#/components/schemas/Reason' }
    BrandMetricPoint:
      type: object
      description: 品牌健康指标的一个点
      required: [brandId, unlockSuccessRate, availability]
      properties:
        at:
          allOf: [{ $ref: './_common.yaml#/components/schemas/Time' }]
          description: 小时序列的时刻
        date:
          allOf: [{ $ref: './_common.yaml#/components/schemas/Date' }]
          description: 日序列的日期
        brandId: { type: string, description: 品牌编号 }
        paused: { type: boolean, description: 该时刻是否低于门槛（小时序列有） }
        unlockSuccessRate: { type: number, nullable: true, description: 开锁成功率, example: 0.874 }
        availability: { type: number, nullable: true, description: 可用率, example: 0.93 }
        rentableVehicles: { type: integer, description: 可租车辆数 }
    PlatformDaily:
      type: object
      description: 平台可用性日统计
      required: [date, entryAvailability, unlockP90Sec, billPushP90Sec]
      properties:
        date: { $ref: './_common.yaml#/components/schemas/Date' }
        entryAvailability: { type: number, description: 骑行入口可用性, example: 0.9992 }
        unlockP90Sec: { type: number, description: 开锁 P90（秒） }
        billPushP90Sec: { type: number, description: 账单推送 P90（秒） }
    Thresholds:
      type: object
      required: [pause, availabilityTarget, unlockP90TargetSec, billPushTargetSec]
      properties:
        pause:
          type: object
          description: 暂停可租门槛
          required: [unlockSuccessRate, availability, sustainMinutes]
          properties:
            unlockSuccessRate: { type: number, description: 开锁成功率门槛, example: 0.9 }
            availability: { type: number, description: 可用率门槛, example: 0.8 }
            sustainMinutes: { type: integer, description: 持续多少分钟低于门槛才提出建议, example: 120 }
        availabilityTarget: { type: number, description: 骑行入口可用性目标, example: 0.995 }
        unlockP90TargetSec: { type: number, description: 开锁 P90 目标（秒） }
        billPushTargetSec: { type: number, description: 账单推送目标（秒） }
    MonitorBrand:
      type: object
      required: [brandId, latest, pause]
      properties:
        brandId: { type: string, description: 品牌编号 }
        latest:
          allOf: [{ $ref: '#/components/schemas/BrandMetricPoint' }]
          nullable: true
          description: 最近一次小时指标
        pause:
          allOf: [{ $ref: '#/components/schemas/Pause' }]
          nullable: true
          description: 尚未恢复的暂停记录
    Monitor:
      type: object
      required: [asOf, degrade, brands, hourly, daily, platformDaily, today, thresholds, alerts, suspendSuggestions, autoPauseByAgent]
      properties:
        asOf: { $ref: './_common.yaml#/components/schemas/Time' }
        degrade: { $ref: '#/components/schemas/DegradeStatus' }
        brands:
          type: array
          description: 有指标的品牌
          items: { $ref: '#/components/schemas/MonitorBrand' }
        hourly:
          type: array
          description: 品牌小时序列
          items: { $ref: '#/components/schemas/BrandMetricPoint' }
        daily:
          type: array
          description: 品牌日序列
          items: { $ref: '#/components/schemas/BrandMetricPoint' }
        platformDaily:
          type: array
          description: 平台可用性日统计
          items: { $ref: '#/components/schemas/PlatformDaily' }
        today:
          type: object
          description: 今日开锁情况，按订阅到的订单事件计数
          required: [requests, unlockFailed, unlockSuccessRate, riding]
          properties:
            requests: { type: integer, description: 今日开锁请求数 }
            unlockFailed: { type: integer, description: 今日开锁失败数 }
            unlockSuccessRate: { type: number, nullable: true, description: 今日开锁成功率，没有请求时为 null }
            riding: { type: integer, description: 当前骑行中单数 }
        thresholds: { $ref: '#/components/schemas/Thresholds' }
        alerts:
          type: array
          description: 未确认告警，新到旧，最多 20 条
          items: { $ref: '#/components/schemas/Alert' }
        suspendSuggestions:
          type: array
          description: 待确认的暂停可租建议
          items: { $ref: '#/components/schemas/SuspendSuggestion' }
        autoPauseByAgent: { type: boolean, description: 自动暂停开关 }
    MonitorLimited:
      type: object
      required: [asOf, limited, brands, hourly]
      properties:
        asOf: { $ref: './_common.yaml#/components/schemas/Time' }
        limited: { type: boolean, enum: [true], description: 精简版标记 }
        brands:
          type: array
          items:
            type: object
            required: [brandId, latest]
            properties:
              brandId: { type: string, description: 品牌编号 }
              latest:
                type: object
                nullable: true
                description: 最近一次开锁成功率
                required: [at, unlockSuccessRate]
                properties:
                  at: { $ref: './_common.yaml#/components/schemas/Time' }
                  unlockSuccessRate: { type: number, description: 开锁成功率 }
        hourly:
          type: array
          description: 开锁成功率小时序列
          items:
            type: object
            required: [at, brandId, unlockSuccessRate]
            properties:
              at: { $ref: './_common.yaml#/components/schemas/Time' }
              brandId: { type: string, description: 品牌编号 }
              unlockSuccessRate: { type: number, nullable: true, description: 开锁成功率 }
    BrandUnlockRate:
      type: object
      required: [brandId, unlockSuccessRate, unlockRateAt]
      properties:
        brandId: { type: string, description: 品牌编号 }
        unlockSuccessRate: { type: number, nullable: true, description: 最近一次开锁成功率，没有指标时为 null }
        unlockRateAt:
          allOf: [{ $ref: './_common.yaml#/components/schemas/Time' }]
          nullable: true
          description: 该指标的时刻
    AlertLevel:
      type: string
      description: 告警级别
      enum: [严重, 警告, 提示]
    Alert:
      type: object
      required: [alertId, at, level, type, text, brandId, degradeEventId, notified, ackBy, ackAt]
      properties:
        alertId: { type: string, description: 告警编号, example: OPS-AL-20261018-01 }
        at: { $ref: './_common.yaml#/components/schemas/Time' }
        level: { $ref: '#/components/schemas/AlertLevel' }
        type:
          type: string
          description: 告警类型
          enum: [降级进入, 降级退出, 降级持续超阈值, 降级单超限, 降级单超时长上限, 接近限额, 达到限额, 暂停可租建议, 暂停可租, 恢复可租, 依赖熔断, 依赖恢复, 运营商不可达, 运营商已恢复, 品牌指标低于门槛, 品牌指标已恢复]
        text: { type: string, description: 告警内容 }
        brandId: { type: string, nullable: true, description: 相关品牌编号 }
        degradeEventId: { type: string, nullable: true, description: 相关降级事件编号 }
        notified:
          type: array
          description: 已通知的值班人账号编号
          items: { type: string }
        ackBy: { type: string, nullable: true, description: 确认人账号编号 }
        ackByName: { type: string, nullable: true, description: 确认人名称 }
        ackAt:
          allOf: [{ $ref: './_common.yaml#/components/schemas/Time' }]
          nullable: true
          description: 确认时刻
    AlertPage:
      allOf:
        - $ref: './_common.yaml#/components/schemas/PageMeta'
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items: { $ref: '#/components/schemas/Alert' }
    PauseMetric:
      type: string
      description: 触发暂停的指标；人工暂停为 人工
      enum: [开锁成功率, 可用率, 人工]
    Pause:
      type: object
      description: 暂停可租记录
      required: [id, brandId, pausedAt, resumedAt, metric, value, threshold, sustainMinutes, by, note, autoResume]
      properties:
        id: { type: string, description: 暂停记录编号, example: OPS-PS-20261130-01 }
        brandId: { type: string, description: 品牌编号 }
        pausedAt:
          allOf: [{ $ref: './_common.yaml#/components/schemas/Time' }]
          description: 暂停时刻
        resumedAt:
          allOf: [{ $ref: './_common.yaml#/components/schemas/Time' }]
          nullable: true
          description: 恢复时刻，尚未恢复为 null
        metric: { $ref: '#/components/schemas/PauseMetric' }
        value: { type: number, nullable: true, description: 触发时的指标值 }
        threshold: { type: number, nullable: true, description: 门槛 }
        sustainMinutes: { type: integer, nullable: true, description: 持续低于门槛的分钟数 }
        by: { type: string, description: 操作人账号编号，运行智能体或运维 }
        byName: { type: string, description: 操作人名称 }
        note: { type: string, nullable: true, description: 说明或事由 }
        autoResume:
          type: boolean
          description: 指标恢复后是否自动恢复可租。因开锁成功率暂停的与人工暂停的固定为 false，只能人工恢复；因可用率暂停的为 true
    SuggestionStatus:
      type: string
      description: 已失效表示指标已恢复到门槛以上
      enum: [待确认, 已确认, 已驳回, 已失效]
    SuspendSuggestion:
      type: object
      description: 运行智能体的暂停可租建议。只对品牌自身问题提出
      required: [id, brandId, at, metric, value, threshold, sustainMinutes, by, note, status, decidedBy, decidedAt, decisionReason, pauseId]
      properties:
        id: { type: string, description: 建议编号, example: OPS-SG-20261201-01 }
        brandId: { type: string, description: 品牌编号 }
        at:
          allOf: [{ $ref: './_common.yaml#/components/schemas/Time' }]
          description: 提出时刻
        metric:
          type: string
          description: 低于门槛的指标
          enum: [开锁成功率, 可用率]
        value: { type: number, description: 指标值 }
        threshold: { type: number, description: 门槛 }
        sustainMinutes: { type: integer, description: 持续低于门槛的分钟数 }
        by: { type: string, description: 提出者账号编号（运行智能体） }
        byName: { type: string, description: 提出者名称 }
        note: { type: string, description: 智能体的判断说明 }
        status: { $ref: '#/components/schemas/SuggestionStatus' }
        decidedBy: { type: string, nullable: true, description: 决定人账号编号 }
        decidedByName: { type: string, nullable: true, description: 决定人名称 }
        decidedAt:
          allOf: [{ $ref: './_common.yaml#/components/schemas/Time' }]
          nullable: true
          description: 决定时刻
        decisionReason: { type: string, nullable: true, description: 决定事由 }
        pauseId: { type: string, nullable: true, description: 确认后生成的暂停记录编号 }
    Todo:
      type: object
      required: [key, label, count, menu]
      properties:
        key:
          type: string
          description: 待办项
          enum: [alerts, closure, suspend]
        label: { type: string, description: 显示名称, example: 未确认告警 }
        count: { type: integer, minimum: 1, description: 数量 }
        menu: { type: string, description: 点击后进入的菜单, example: 运行监控 }
