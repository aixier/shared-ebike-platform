    post:
      operationId: submitOperatorDispute
      summary: 提交异议（运营商）
      description: 只能对时长、里程提异议，价格不受理；订单须在该结算单的明细或调整项中。提交后对账智能体即时比对订单事实，给出 agentComparison 与 agentSuggestion。
      tags: [运营商]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.operator.disputes.submit
      x-requirements: [R-23, BR-16, R-46]
      x-permissions: [dispute.submit.own]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, SCOPE_DENIED, READONLY, NOT_FOUND, INVALID, PRICE_NOT_DISPUTABLE, IN_PROGRESS]
      parameters:
        - { $ref: './_common.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settlementId, orderIds, field, claim]
              properties:
                settlementId: { type: string, description: 结算单号 }
                orderIds: { type: array, minItems: 1, description: 有异议的订单号, items: { type: string } }
                field: { type: string, description: 异议项；只受理"时长""里程"，其他值（如"价格"）返回 PRICE_NOT_DISPUTABLE, example: 时长 }
                claim: { type: string, minLength: 6, description: 运营商方的记录与理由（至少 6 个字） }
      responses:
        '200':
          description: 新建的异议
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }
