        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
components:
  securitySchemes:
    adminAuth: { $ref: './_common.yaml#/components/securitySchemes/adminAuth' }
  parameters:
    SettlementId:
      name: settlementId
      in: path
      required: true
      description: 结算单号
      schema: { type: string, example: ST-M-202610-OP01 }
    DisputeId:
      name: disputeId
      in: path
      required: true
      description: 异议编号
      schema: { type: string, example: DS202611003 }
    OrderId:
      name: orderId
      in: path
      required: true
      description: 订单号
      schema: { type: string, example: OD2026102613011 }
  responses:
    CsvFile:
      description: CSV 文件
      headers:
        Content-Disposition:
          description: 'attachment; filename*=UTF-8''''<文件名>'
          schema: { type: string }
        X-Total-Count:
          description: 数据行数
          schema: { type: integer }
      content:
        text/csv:
          schema: { type: string, format: binary }
  schemas:
    SettlementStatus:
      type: string
      enum: [待审核, 已审核, 已发送, 已到账]
      description: 结算单状态
    DisputeStatus:
      type: string
      enum: [待核实, 已采纳, 已驳回, 无需调整]
      description: 异议状态
    OrderStatus:
      type: string
      enum: [开锁失败, 骑行中, 已结束, 待人工处理]
      description: 订单状态
    AdjustmentType:
      type: string
      enum: [晚到补报, 出单后退款, 异议核实, 人工调整]
      description: 调整项类型
    SettlementTotals:
      type: object
      description: 结算单合计；payableFee = detailFee + adjustmentFee
      required: [orderCount, receivableSum, baseSum, detailFee, adjustmentFee, payableFee]
      properties:
        orderCount: { type: integer, description: 明细订单数 }
        receivableSum: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], description: 订单应收合计 }
        baseSum: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], description: 服务费基数合计 }
        detailFee: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], description: 明细服务费合计 }
        adjustmentFee: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], description: 调整项服务费差额合计（可负） }
        payableFee: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], description: 应付服务费 }
    MonthCardAllocation:
      type: object
      description: 当月全平台月卡收入及分摊规则；基数取订单应收时只作收入归属展示，不进服务费
      properties:
        platformIncome: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], description: 当月全平台月卡收入（按支付时间归月） }
        allocationRule: { type: string, description: 分配规则, example: 按骑行单数 }
        platformCardOrders: { type: integer, description: 当月全平台使用月卡抵扣的订单数 }
        note: { type: string, nullable: true, description: 说明 }
    RatioGroup:
      type: object
      description: 同一品牌按服务费比例分组（月内比例变过时有多组）
      required: [ratio, orderCount, baseSum, fee]
      properties:
        ratio: { type: number, description: 服务费比例, example: 0.62 }
        pricingVersionIds: { type: array, description: 该比例对应的规则版本号, items: { type: string } }
        orderCount: { type: integer, description: 订单数 }
        baseSum: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], description: 基数合计 }
        fee: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], description: 服务费合计 }
    SettlementBrand:
      type: object
      description: 结算单上某品牌的汇总
      required: [brandId, orderCount, receivableSum, baseSum, detailFee, adjustmentFee]
      properties:
        brandId: { type: string, description: 品牌编号 }
        brandName: { type: string, description: 品牌名（settle 订阅 fleet 事件得到的投影） }
        orderCount: { type: integer, description: 明细订单数 }
        receivableSum: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], description: 订单应收合计 }
        baseSum: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], description: 服务费基数合计 }
        detailFee: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], description: 明细服务费合计 }
        ratioBreakdown: { type: array, description: 按比例分组, items: { $ref: '#/components/schemas/RatioGroup' } }
        adjustmentFee: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], description: 该品牌调整项服务费差额合计 }
        monthCardOrderCount: { type: integer, description: 该品牌当月使用月卡抵扣的订单数 }
        monthCardShare: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], description: 该品牌分得的月卡收入 }
    AdjustmentItem:
      type: object
      description: 调整项逐单记录；feeDelta = 服务费(newBase) − 服务费(previousBase)
      required: [orderId, previousBase, newBase, baseDelta, ratio, feeDelta]
      properties:
        orderId: { type: string, description: 订单号 }
        endAt: { allOf: [{ $ref: './_common.yaml#/components/schemas/Time' }], description: 订单结束时刻 }
        previousBase: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], description: 调整前服务费基数（晚到补报为 0） }
        newBase: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], description: 调整后服务费基数 }
        baseDelta: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], description: 基数差额（可负） }
        ratio: { type: number, description: 开锁时刻该品牌服务费比例, example: 0.62 }
        feeDelta: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], description: 服务费差额（可负） }
    Adjustment:
      type: object
      description: 调整项
      required: [adjustmentId, type, brandId, feeDelta, reason, createdBy, createdAt]
      properties:
        adjustmentId: { type: string, description: 调整项编号, example: ADJ-202610-OP01-01 }
        type: { $ref: '#/components/schemas/AdjustmentType' }
        brandId: { type: string, description: 品牌编号 }
        brandName: { type: string, description: 品牌名 }
        items: { type: array, description: 逐单记录（人工调整为空）, items: { $ref: '#/components/schemas/AdjustmentItem' } }
        orderIds: { type: array, description: 人工调整关联的订单号, items: { type: string } }
        baseDelta: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], description: 基数差额合计（人工调整为 0） }
        feeDelta: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], description: 服务费差额合计（可负） }
        reason: { type: string, description: 原因或事由 }
        disputeId: { type: string, nullable: true, description: 异议核实类调整项对应的异议编号 }
        createdBy: { allOf: [{ $ref: './_common.yaml#/components/schemas/Actor' }], description: 生成人（对账智能体或财务） }
        createdAt: { $ref: './_common.yaml#/components/schemas/Time' }
        confirmedBy: { allOf: [{ $ref: './_common.yaml#/components/schemas/Actor' }], nullable: true, description: 确认人；未确认为 null }
        confirmedAt: { allOf: [{ $ref: './_common.yaml#/components/schemas/Time' }], nullable: true, description: 确认时刻 }
    SettlementLine:
      type: object
      description: 结算单逐单明细（出单时冻结，不再修改）
      required: [orderId, brandId, endAt, receivable, base, ratio, fee]
      properties:
        orderId: { type: string, description: 订单号 }
        brandId: { type: string, description: 品牌编号 }
        startAt: { allOf: [{ $ref: './_common.yaml#/components/schemas/Time' }], description: 计费起点 }
        endAt: { allOf: [{ $ref: './_common.yaml#/components/schemas/Time' }], description: 计费终点（决定结算月） }
        billedMinutes: { type: integer, description: 计费分钟 }
        distanceKm: { type: number, description: 里程（公里，一位小数，不参与计价） }
        degraded: { type: boolean, description: 是否降级单 }
        pricingVersionId: { type: string, description: 开锁时刻有效的规则版本号 }
        receivable: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], description: 订单应收 }
        refundedAtGeneration: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], description: 出单时已退款金额 }
        base: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], description: 服务费基数 }
        ratio: { type: number, description: 服务费比例, example: 0.62 }
        fee: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], description: 单单服务费 = 基数 × 比例，四舍五入到分 }
        remark: { type: string, nullable: true, description: 备注，如"降级单""0 元订单" }
    Settlement:
      type: object
      description: 结算单（不含逐单明细）
      required: [settlementId, operatorId, month, status, totals, brands, adjustments]
      properties:
        settlementId: { type: string, description: 结算单号, example: ST-M-202610-OP01 }
        operatorId: { type: string, description: 运营商编号 }
        operatorName: { type: string, description: 运营商简称（settle 订阅 fleet 事件得到的投影） }
        month: { allOf: [{ $ref: './_common.yaml#/components/schemas/Month' }], description: 结算月 }
        generatedAt: { allOf: [{ $ref: './_common.yaml#/components/schemas/Time' }], description: 出单时刻；预览时为当前时刻 }
        dueDate: { allOf: [{ $ref: './_common.yaml#/components/schemas/Date' }], description: 到账期限（次月 6 日，含） }
        status: { type: string, enum: [未出单, 待审核, 已审核, 已发送, 已到账], description: 状态；"未出单"只出现在本期预览 }
        overdue: { type: boolean, description: 已过到账期限仍未到账 }
        reviewedBy: { allOf: [{ $ref: './_common.yaml#/components/schemas/Actor' }], nullable: true, description: 审核人 }
        reviewedAt: { allOf: [{ $ref: './_common.yaml#/components/schemas/Time' }], nullable: true, description: 审核时刻 }
        sentAt: { allOf: [{ $ref: './_common.yaml#/components/schemas/Time' }], nullable: true, description: 发送给运营商的时刻 }
        paidAt: { allOf: [{ $ref: './_common.yaml#/components/schemas/Time' }], nullable: true, description: 到账时刻 }
        bankTradeNo: { type: string, nullable: true, description: 银行流水号 }
        invoiceStatus: { type: string, nullable: true, description: 发票状态，如"待开票""已收到发票" }
        totals: { $ref: '#/components/schemas/SettlementTotals' }
        monthCard: { $ref: '#/components/schemas/MonthCardAllocation' }
        brands: { type: array, description: 各品牌汇总, items: { $ref: '#/components/schemas/SettlementBrand' } }
        adjustments: { type: array, description: 调整项, items: { $ref: '#/components/schemas/Adjustment' } }
        detailCount: { type: integer, description: 明细条数 }
        note: { type: string, nullable: true, description: 备注，如"运营商已退出，本期为最后一期结算" }
        previewNote: { type: string, nullable: true, description: 仅本期预览：预览口径说明 }
    SettlementDetail:
      description: 结算单含逐单明细
      allOf:
        - $ref: '#/components/schemas/Settlement'
        - type: object
          required: [details]
          properties:
            details: { type: array, description: 逐单明细，按结束时刻升序, items: { $ref: '#/components/schemas/SettlementLine' } }
    SettlementPage:
      allOf:
        - $ref: './_common.yaml#/components/schemas/PageMeta'
        - type: object
          required: [rows]
          properties:
            rows: { type: array, items: { $ref: '#/components/schemas/Settlement' } }
    DisputeCorrection:
      type: object
      description: 采纳异议时逐单的更正
      required: [orderId, minutes, baseDelta]
      properties:
        orderId: { type: string, description: 订单号 }
        minutes: { type: integer, description: 核实后的计费分钟数 }
        baseDelta: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], description: 服务费基数更正额（可负） }
    Dispute:
      type: object
      description: 运营商异议
      required: [disputeId, operatorId, settlementId, orderIds, field, operatorClaim, status, submittedAt]
      properties:
        disputeId: { type: string, description: 异议编号, example: DS202611003 }
        operatorId: { type: string, description: 运营商编号 }
        operatorName: { type: string, description: 运营商简称 }
        settlementId: { type: string, description: 结算单号 }
        orderIds: { type: array, description: 异议订单号, items: { type: string } }
        field: { type: string, enum: [时长, 里程], description: 异议项 }
        operatorClaim: { type: string, description: 运营商方的记录与理由 }
        platformFact: { type: string, description: 平台记录的订单事实 }
        agentComparison: { type: string, description: 对账智能体比对结论 }
        agentSuggestion: { type: string, nullable: true, description: 对账智能体建议（采纳、驳回、无需调整之一及说明） }
        status: { $ref: '#/components/schemas/DisputeStatus' }
        submittedAt: { $ref: './_common.yaml#/components/schemas/Time' }
        submittedBy: { allOf: [{ $ref: './_common.yaml#/components/schemas/Actor' }], description: 提交人 }
        decidedAt: { allOf: [{ $ref: './_common.yaml#/components/schemas/Time' }], nullable: true, description: 处理时刻 }
        decidedBy: { allOf: [{ $ref: './_common.yaml#/components/schemas/Actor' }], nullable: true, description: 处理人 }
        decisionReason: { type: string, nullable: true, description: 处理事由 }
        corrections: { type: array, description: 采纳时的逐单更正, items: { $ref: '#/components/schemas/DisputeCorrection' } }
        adjustmentId: { type: string, nullable: true, description: 差额进入的调整项编号（下一期出单后才有） }
    DisputeDetail:
      description: 异议含订单事实
      allOf:
        - $ref: '#/components/schemas/Dispute'
        - type: object
          required: [orders]
          properties:
            orders: { type: array, description: 异议订单事实, items: { $ref: '#/components/schemas/OperatorOrder' } }
    DisputePage:
      allOf:
        - $ref: './_common.yaml#/components/schemas/PageMeta'
        - type: object
          required: [rows]
          properties:
            rows: { type: array, items: { $ref: '#/components/schemas/Dispute' } }
    SettlementPointer:
      type: object
      description: 订单所在的结算记录；退款类调整项不改此指针（仍以首次结算为准）
      required: [settlementId, kind]
      properties:
        settlementId: { type: string, description: 结算单号 }
        kind: { type: string, enum: [明细, 调整项], description: 进入方式 }
        adjustmentId: { type: string, nullable: true, description: 以调整项进入时的调整项编号 }
    OrderSettlement:
      type: object
      description: 订单的结算归属
      required: [orderId, operatorId]
      properties:
        orderId: { type: string, description: 订单号 }
        operatorId: { type: string, description: 运营商编号 }
        settleMonth: { allOf: [{ $ref: './_common.yaml#/components/schemas/Month' }], nullable: true, description: 结算月 = 结束时刻所在月；未结束为 null }
        settlement: { allOf: [{ $ref: '#/components/schemas/SettlementPointer' }], nullable: true, description: 所在结算记录；尚未结算为 null }
        settlementNote: { type: string, nullable: true, description: 差额去向说明，如"出单后才收到补报，计入 2026-12 结算单调整项" }
        disputeIds: { type: array, description: 关联异议编号, items: { type: string } }
    OperatorOrder:
      type: object
      description: 运营商看的订单（settle 订阅 ride、bill 事件得到的投影）。不含用户编号、姓名、手机号等任何用户字段。
      required: [orderId, vehicleId, brandId, status, requestAt, degraded, lateReport]
      properties:
        orderId: { type: string, description: 订单号 }
        vehicleId: { type: string, description: 车辆编号 }
        plateNo: { type: string, nullable: true, description: 车号 }
        brandId: { type: string, description: 品牌编号 }
        brandName: { type: string, description: 品牌名 }
        status: { $ref: '#/components/schemas/OrderStatus' }
        requestAt: { allOf: [{ $ref: './_common.yaml#/components/schemas/Time' }], description: 开锁请求时刻 }
        unlockResult: { type: string, nullable: true, enum: [成功, 失败, 超时后成功, null], description: 开锁结果 }
        unlockFailReason: { type: string, nullable: true, enum: [车辆无响应, 电量不足, 车辆故障, 车辆被占用, null], description: 开锁失败原因 }
        startAt: { allOf: [{ $ref: './_common.yaml#/components/schemas/Time' }], nullable: true, description: 计费起点 = 开锁成功报告时刻 }
        startLocation: { allOf: [{ $ref: './_common.yaml#/components/schemas/Location' }], nullable: true, description: 开锁位置 }
        endAt: { allOf: [{ $ref: './_common.yaml#/components/schemas/Time' }], nullable: true, description: 计费终点 }
        lockReportAt: { allOf: [{ $ref: './_common.yaml#/components/schemas/Time' }], nullable: true, description: 运营商锁车报告中的锁车时刻 }
        pileInAt: { allOf: [{ $ref: './_common.yaml#/components/schemas/Time' }], nullable: true, description: 桩识别在位时刻 }
        endLocation: { allOf: [{ $ref: './_common.yaml#/components/schemas/Location' }], nullable: true, description: 锁车位置 }
        endMethod:
          type: string
          nullable: true
          enum: [入桩识别, 用户锁车, 页面还车, 入桩未锁·平台请求结束, 超时开锁·平台请求结束, 客服强制结束, null]
          description: 结束方式
        inStation: { type: boolean, nullable: true, description: 是否在点 }
        inStationBasis:
          type: string
          nullable: true
          enum: [桩识别, 无桩站点·车端判定, 车端判定, 桩满·围栏内, 桩故障或离线·车端判定, 桩与车端冲突·以桩为准, 站外, null]
          description: 在点依据
        endStationId: { type: string, nullable: true, description: 还车站点编号 }
        endStationName: { type: string, nullable: true, description: 还车站点名（订单已结束事件带来的快照） }
        durationSec: { type: integer, nullable: true, description: 时长（秒） }
        billedMinutes: { type: integer, nullable: true, description: 计费分钟 }
        distanceKm: { type: number, nullable: true, description: 里程（公里，一位小数） }
        pricingVersionId: { type: string, description: 开锁时刻有效的规则版本号 }
        receivable: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], nullable: true, description: 订单应收；没有金额时为 null }
        dispatchFee: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], nullable: true, description: 调度费 }
        degraded: { type: boolean, description: 是否降级单 }
        lateReport: { type: boolean, description: 是否补报 }
        reportReceivedAt: { allOf: [{ $ref: './_common.yaml#/components/schemas/Time' }], nullable: true, description: 平台收到结束事件的时刻 }
        settleMonth: { allOf: [{ $ref: './_common.yaml#/components/schemas/Month' }], nullable: true, description: 结算月 }
        settlement: { allOf: [{ $ref: '#/components/schemas/SettlementPointer' }], nullable: true, description: 所在结算记录 }
        settlementNote: { type: string, nullable: true, description: 差额去向说明 }
        disputeIds: { type: array, description: 关联异议编号, items: { type: string } }
    OperatorOrderSummary:
      type: object
      description: 筛选范围内全部订单的汇总（不随分页变化）
      required: [count, finished, receivableSum, degraded]
      properties:
        count: { type: integer, description: 订单数 }
        finished: { type: integer, description: 有金额的订单数 }
        receivableSum: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], description: 订单应收合计 }
        degraded: { type: integer, description: 降级单数 }
    OperatorOrderPage:
      allOf:
        - $ref: './_common.yaml#/components/schemas/PageMeta'
        - type: object
          required: [rows, summary]
          properties:
            rows: { type: array, items: { $ref: '#/components/schemas/OperatorOrder' } }
            summary: { $ref: '#/components/schemas/OperatorOrderSummary' }
    Todo:
      type: object
      description: 一项待办计数
      required: [key, label, count, menu]
      properties:
        key: { type: string, enum: [settlements, disputes, myDisputes], description: 待办键 }
        label: { type: string, description: 展示文字, example: 待审核结算单 }
        count: { type: integer, description: 条数 }
        menu: { type: string, description: 对应菜单, example: 结算单管理 }
