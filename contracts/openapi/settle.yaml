      description: 按当前账号权限返回本模块的待办：有 settlement.manage 给"待审核结算单"，有 dispute.decide 给"待核实异议"，有 dispute.submit.own 给本运营商"异议待平台核实"。count 为 0 的项也返回，由前端汇总时过滤。
      tags: [公共]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.me
      x-requirements: [R-23, BR-20]
      x-permissions: [登录]
