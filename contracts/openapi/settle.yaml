openapi: 3.0.3
info:
  title: 共享电单车监管平台 · settle 结算
  version: 1.0.0
  description: |
    月度结算单、调整项、运营商异议、运营商订单明细（settle 自己的投影，不含任何用户字段）。
    金额一律整数分；服务费比例为小数（如 0.62）；时间 RFC 3339。
    settle 没有 /internal 接口，只被页面调用。
    运营商岗位的接口只返回本运营商数据，访问他家返回 SCOPE_DENIED；已退出运营商的只读账号写操作返回 READONLY；收到 `fleet.operator.exited` 之后，该运营商范围（令牌 `scope`）的写操作一律返回 READONLY，不等令牌里的 `readonly` 刷新。
    请求体必须是 UTF-8，否则返回 400 INVALID（请求体不是 UTF-8 编码）。写接口重复提交同一 Idempotency-Key 而首次仍在处理时返回 409 IN_PROGRESS。
tags:
  - name: 财务
  - name: 运营商
  - name: 公共
paths:
  /api/settle/finance/settlements:
    get:
      operationId: listFinanceSettlements
      summary: 结算单列表（财务）
      description: 按结算月新到旧、同月按运营商编号升序；不含逐单明细，给出 detailCount。
      tags: [财务]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.finance.settlements.list
      x-requirements: [R-23, BR-17, BR-20]
      x-permissions: [settlement.manage]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, INVALID]
      parameters:
        - { name: month, in: query, description: 结算月, schema: { $ref: './_common.yaml#/components/schemas/Month' } }
        - { name: operatorId, in: query, description: 运营商编号, schema: { type: string } }
        - { name: status, in: query, description: 结算单状态, schema: { $ref: '#/components/schemas/SettlementStatus' } }
        - { $ref: './_common.yaml#/components/parameters/Page' }
        - { $ref: './_common.yaml#/components/parameters/PageSize' }
      responses:
        '200':
          description: 分页结算单
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementPage' }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
  /api/settle/finance/settlements/preview:
    get:
      operationId: previewFinanceSettlement
      summary: 本期实时预览（财务）
      description: 指定运营商本期（未出单）的实时汇总，随新订单、退款、补报、异议实时变化；status 为"未出单"，含明细与待进单调整项。
      tags: [财务]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.finance.settlements.preview
      x-requirements: [R-23, R-24, BR-19]
      x-permissions: [settlement.manage]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, NOT_FOUND]
      parameters:
        - { name: operatorId, in: query, required: true, description: 运营商编号, schema: { type: string } }
      responses:
        '200':
          description: 本期预览
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementDetail' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
  /api/settle/finance/settlements/generate:
    post:
      operationId: generateSettlements
      summary: 手动出单（财务）
      description: 该结算月结束（次月 1 日 00:00）后即可为各运营商生成结算单；未手动生成时次月 1 日 00:30 自动出单。没有明细也没有调整项的运营商不出单。
      tags: [财务]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.finance.settlements.generate
      x-requirements: [R-23, BR-17, BR-19, BR-20]
      x-permissions: [settlement.manage]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, INVALID, MONTH_NOT_ENDED, ALREADY_GENERATED, READONLY, IN_PROGRESS]
      parameters:
        - { $ref: './_common.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [month]
              properties:
                month: { allOf: [{ $ref: './_common.yaml#/components/schemas/Month' }], description: 要出单的结算月 }
      responses:
        '200':
          description: 本次生成的结算单（不含明细）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Settlement' }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }
  /api/settle/finance/settlements/{settlementId}:
    get:
      operationId: getFinanceSettlement
      summary: 结算单详情（财务）
      description: 含逐单明细与调整项。
      tags: [财务]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.finance.settlements.get
      x-requirements: [R-23, BR-17, BR-18]
      x-permissions: [settlement.manage]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, NOT_FOUND]
      parameters:
        - { $ref: '#/components/parameters/SettlementId' }
      responses:
        '200':
          description: 结算单
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementDetail' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
  /api/settle/finance/settlements/{settlementId}/export:
    get:
      operationId: exportFinanceSettlement
      summary: 导出结算单明细（财务）
      description: 返回 CSV 文件（UTF-8 带 BOM），文件名 `<结算单号>.csv`。列：订单号、品牌、结束、计费分钟、订单应收、服务费基数、比例、服务费、备注；金额列以元显示。
      tags: [财务]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.finance.settlements.export
      x-requirements: [R-23, BR-17]
      x-permissions: [settlement.manage]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, NOT_FOUND]
      parameters:
        - { $ref: '#/components/parameters/SettlementId' }
      responses:
        '200': { $ref: '#/components/responses/CsvFile' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
  /api/settle/finance/settlements/{settlementId}/adjustments:
    post:
      operationId: addSettlementAdjustment
      summary: 录入人工调整项（财务）
      description: 只有待审核的结算单可以录入；类型为"人工调整"，录入即视为已确认，结算单合计随之重算。
      tags: [财务]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.finance.settlements.addAdjustment
      x-requirements: [R-23, BR-18, BR-20]
      x-permissions: [settlement.adjust]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, NOT_FOUND, INVALID, REASON_REQUIRED, SETTLEMENT_STATE, READONLY, IN_PROGRESS]
      parameters:
        - { $ref: '#/components/parameters/SettlementId' }
        - { $ref: './_common.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brandId, feeDelta, reason]
              properties:
                brandId: { type: string, description: 品牌编号，须属于该结算单的运营商 }
                feeDelta: { allOf: [{ $ref: './_common.yaml#/components/schemas/Money' }], description: 服务费增减（分），非零，可为负 }
                orderIds: { type: array, description: 关联订单号（可空）, items: { type: string } }
                reason: { $ref: './_common.yaml#/components/schemas/Reason' }
      responses:
        '200':
          description: 更新后的结算单（不含明细）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settlement' }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }
  /api/settle/finance/settlements/{settlementId}/adjustments/{adjustmentId}/confirm:
    post:
      operationId: confirmSettlementAdjustment
      summary: 确认调整项（财务）
      description: 确认对账智能体生成的调整项；只有待审核的结算单可以确认。
      tags: [财务]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.finance.settlements.confirmAdjustment
      x-requirements: [R-23, BR-19, BR-20]
      x-permissions: [settlement.adjust]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, NOT_FOUND, SETTLEMENT_STATE, ALREADY_DONE, INVALID, READONLY, IN_PROGRESS]
      parameters:
        - { $ref: '#/components/parameters/SettlementId' }
        - { name: adjustmentId, in: path, required: true, description: 调整项编号, schema: { type: string, example: ADJ-202610-OP01-01 } }
        - { $ref: './_common.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, description: 确认备注（可空，空时留痕取调整项原因） }
      responses:
        '200':
          description: 更新后的结算单（不含明细）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settlement' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }
  /api/settle/finance/settlements/{settlementId}/review:
    post:
      operationId: reviewSettlement
      summary: 审核结算单（财务）
      description: 待审核 → 已审核；有未确认调整项时不能审核。
      tags: [财务]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.finance.settlements.review
      x-requirements: [R-23, BR-20]
      x-permissions: [settlement.manage]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, NOT_FOUND, SETTLEMENT_STATE, ADJUSTMENT_UNCONFIRMED, INVALID, READONLY, IN_PROGRESS]
      parameters:
        - { $ref: '#/components/parameters/SettlementId' }
        - { $ref: './_common.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, description: 审核备注（可空） }
      responses:
        '200':
          description: 更新后的结算单（不含明细）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settlement' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }
  /api/settle/finance/settlements/{settlementId}/send:
    post:
      operationId: sendSettlement
      summary: 发送结算单给运营商（财务）
      description: 已审核 → 已发送。
      tags: [财务]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.finance.settlements.send
      x-requirements: [R-23, BR-20]
      x-permissions: [settlement.manage]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, NOT_FOUND, SETTLEMENT_STATE, INVALID, READONLY, IN_PROGRESS]
      parameters:
        - { $ref: '#/components/parameters/SettlementId' }
        - { $ref: './_common.yaml#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: 更新后的结算单（不含明细）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settlement' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }
  /api/settle/finance/settlements/{settlementId}/payment:
    post:
      operationId: registerSettlementPayment
      summary: 登记到账（财务）
      description: 已发送 → 已到账；记录银行流水号与到账时间。本模块不付款，只登记。
      tags: [财务]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.finance.settlements.registerPayment
      x-requirements: [R-23, BR-20]
      x-permissions: [settlement.manage]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, NOT_FOUND, INVALID, SETTLEMENT_STATE, READONLY, IN_PROGRESS]
      parameters:
        - { $ref: '#/components/parameters/SettlementId' }
        - { $ref: './_common.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bankTradeNo]
              properties:
                bankTradeNo: { type: string, pattern: '^[A-Z0-9]{8,32}$', description: 银行流水号 }
                paidAt: { allOf: [{ $ref: './_common.yaml#/components/schemas/Time' }], description: 到账时间，缺省为当前时刻 }
      responses:
        '200':
          description: 更新后的结算单（不含明细）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settlement' }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }
  /api/settle/finance/disputes:
    get:
      operationId: listFinanceDisputes
      summary: 异议列表（财务）
      description: 按提交时间新到旧。
      tags: [财务]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.finance.disputes.list
      x-requirements: [R-23, BR-16]
      x-permissions: [dispute.decide]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN]
      parameters:
        - { name: status, in: query, description: 异议状态, schema: { $ref: '#/components/schemas/DisputeStatus' } }
        - { name: operatorId, in: query, description: 运营商编号, schema: { type: string } }
        - { $ref: './_common.yaml#/components/parameters/Page' }
        - { $ref: './_common.yaml#/components/parameters/PageSize' }
      responses:
        '200':
          description: 分页异议
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisputePage' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
  /api/settle/finance/disputes/{disputeId}:
    get:
      operationId: getFinanceDispute
      summary: 异议详情（财务）
      description: 含异议订单事实 orders[]（settle 的订单投影，不含用户）。
      tags: [财务]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.finance.disputes.get
      x-requirements: [R-23, BR-16]
      x-permissions: [dispute.decide]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, NOT_FOUND]
      parameters:
        - { $ref: '#/components/parameters/DisputeId' }
      responses:
        '200':
          description: 异议
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisputeDetail' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
  /api/settle/finance/disputes/{disputeId}/decide:
    post:
      operationId: decideDispute
      summary: 处理异议（财务）
      description: 采纳、驳回或判无需调整。采纳时长异议须给每单核实后的分钟数；里程不参与计价，不能采纳（INVALID，应选"无需调整"）。采纳只更正服务费基数、不向用户补收，差额进下一期"异议核实"调整项。
      tags: [财务]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.finance.disputes.decide
      x-requirements: [R-23, BR-16, BR-19]
      x-permissions: [dispute.decide]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, NOT_FOUND, INVALID, REASON_REQUIRED, ALREADY_DONE, READONLY, IN_PROGRESS]
      parameters:
        - { $ref: '#/components/parameters/DisputeId' }
        - { $ref: './_common.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: { type: string, enum: [采纳, 驳回, 无需调整], description: 处理结果 }
                corrections:
                  type: array
                  description: 采纳时必填：每单核实后的计费分钟数
                  items:
                    type: object
                    required: [orderId, minutes]
                    properties:
                      orderId: { type: string, description: 订单号，须在该异议中 }
                      minutes: { type: integer, minimum: 1, maximum: 600, description: 核实后的计费分钟数 }
                reason: { $ref: './_common.yaml#/components/schemas/Reason' }
      responses:
        '200':
          description: 处理后的异议
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }
  /api/settle/operator/orders:
    get:
      operationId: listOperatorOrders
      summary: 订单明细（运营商）
      description: 本运营商订单，按开锁请求时刻新到旧，含降级单与补报标记；另返回筛选范围内的汇总。不含任何用户字段。
      tags: [运营商]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.operator.orders.list
      x-requirements: [R-24, R-46, NFR-11]
      x-permissions: [order.view.own]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, SCOPE_DENIED, INVALID]
      parameters:
        - { name: date, in: query, description: 开锁请求日期（单日）, schema: { $ref: './_common.yaml#/components/schemas/Date' } }
        - { name: from, in: query, description: 开锁请求时刻起, schema: { $ref: './_common.yaml#/components/schemas/Time' } }
        - { name: to, in: query, description: 开锁请求时刻止, schema: { $ref: './_common.yaml#/components/schemas/Time' } }
        - { name: brandId, in: query, description: 品牌编号, schema: { type: string } }
        - { name: status, in: query, description: 订单状态, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: degraded, in: query, description: 只看降级单或只看非降级单, schema: { type: boolean } }
        - { name: q, in: query, description: 订单号（包含匹配）或车号（完全匹配）, schema: { type: string } }
        - { $ref: './_common.yaml#/components/parameters/Page' }
        - { $ref: './_common.yaml#/components/parameters/PageSize' }
        - { $ref: './_common.yaml#/components/parameters/SortKey' }
        - { $ref: './_common.yaml#/components/parameters/SortDir' }
      responses:
        '200':
          description: 分页订单与汇总
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorOrderPage' }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
  /api/settle/operator/orders/export:
    get:
      operationId: exportOperatorOrders
      summary: 下载订单明细（运营商）
      description: 返回 CSV 文件（UTF-8 带 BOM），按开锁请求时刻旧到新，含降级单与补报标记；文件名 `<运营商简称>_订单明细_<日期或起止>.csv`，条数在响应头 X-Total-Count。金额列以元显示。
      tags: [运营商]
      security: [{ adminAuth: [] }]
      x-prototype: api.admin.operator.orders.export
      x-requirements: [R-24, R-46, NFR-11]
      x-permissions: [order.export.own]
      x-errors: [ADMIN_NOT_LOGGED_IN, FORBIDDEN, SCOPE_DENIED, INVALID]
      parameters:
        - { name: date, in: query, description: 开锁请求日期（单日）, schema: { $ref: './_common.yaml#/components/schemas/Date' } }
