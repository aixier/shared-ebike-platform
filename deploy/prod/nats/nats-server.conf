# NATS JetStream 生产配置模板：三节点集群（同机房三台机器，各跑一份，改 server_name 与 routes）。
# 三节点使流可以 3 副本，单台故障不丢事件、不停服务。
server_name: <bike-nats-1>
host: 0.0.0.0
port: 4222
http: "127.0.0.1:8222"

# 服务连接需要账号；每个服务一个用户，口令放在各服务 NATS_URL 里（nats://<用户>:<口令>@host:4222）
authorization {
  users = [
    # { user: "acct", password: "<口令>" }  ……15 个服务各一行
  ]
}

jetstream {
  store_dir: /var/lib/nats/jetstream
  max_file_store: 200G
  max_memory_store: 1G
  sync_interval: always
}

cluster {
  name: bike-<城市>
  host: 0.0.0.0
  port: 6222
  routes: [
    nats-route://<bike-nats-1>:6222
    nats-route://<bike-nats-2>:6222
    nats-route://<bike-nats-3>:6222
  ]
}

max_payload: 1MB
write_deadline: "10s"
log_file: /var/log/nats/nats-server.log
logfile_size_limit: 100MB
